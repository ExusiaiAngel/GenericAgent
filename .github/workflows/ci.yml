name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
        python -m pip install -e ".[ui]"

    - name: Lint with flake8
      run: |
        python -m pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,.portable,assets

    - name: Test core imports
      run: |
        python -c "import mykey; import llmcore; import agent_loop; import ga; print('Core imports: OK')"
        python -c "import TMWebDriver; print('TMWebDriver: OK')"

    - name: Check mykey.py exists
      run: |
        test -f mykey.py && echo 'mykey.py: EXISTS' || echo 'mykey.py: MISSING'

    - name: Check memory files
      run: |
        echo "SOP files: $(ls memory/*_sop.md 2>/dev/null | wc -l)"
        echo "Total memory: $(du -sh memory/ | cut -f1)"

    - name: Syntax check all Python files
      run: |
        find . -name '*.py' -not -path './.portable/*' -not -path './__pycache__/*' -exec python -m py_compile {} \;
        echo 'All Python files: SYNTAX OK'
